upstream api_server_pre {
    server 10.0.6.6:8090;
}

upstream manager_server_pre {
    server 10.0.6.6:8092;
}

server {
    listen 80;
    server_name www-pre.infinitepai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www-pre.infinitepai.com;
    include /etc/nginx/ssl/ssl.conf;

    root /usr/share/nginx/html/official-website-pre;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    server_name api-pre.infinitepai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api-pre.infinitepai.com;
    client_max_body_size 10M;
    large_client_header_buffers 4 16k;

    include /etc/nginx/ssl/ssl.conf;

    location ^~ / {
        proxy_pass http://api_server_pre;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name manager-pre.infinitepai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name manager-pre.infinitepai.com;

    include /etc/nginx/ssl/ssl.conf;

    root /usr/share/nginx/html/app-manager-web-pre;
    index index.html;

    large_client_header_buffers 4 16k;

    # 管理端 API：保留完整的 /pai/admin/v1/... 路径
    location ^~ /pai/admin/v1/ {
        proxy_pass http://manager_server_pre;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 后台包含视频上传；当前 10M 会产生 413
        client_max_body_size 2100m;
    }

    # 后端生成的上传文件地址
    location ^~ /uploads/ {
        proxy_pass http://manager_server_pre;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 如果 /media 文件也由 app-manager-server 提供，则保留这段
    location ^~ /media/ {
        proxy_pass http://manager_server_pre;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}